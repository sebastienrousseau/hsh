name: Release

# Triggered by pushing a semver tag (v0.0.9, v0.1.0, v1.0.0, …).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

# Default to read-only at workflow level; jobs elevate per-need
# (attest → id-token+attestations write; github-release → contents
# write; publish → environment-scoped crates-io token).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Quality gate — fmt, clippy, test, doc must all pass before we even
  # consider publishing.
  # ---------------------------------------------------------------------
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --all-features
      - name: doc
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ---------------------------------------------------------------------
  # Tag verification — assert the git tag matches Cargo.toml.
  # ---------------------------------------------------------------------
  verify-version:
    runs-on: ubuntu-latest
    needs: quality-gate
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract tag version
        id: extract
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          echo "Tag version: $tag"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Cross-check tag against every publishable Cargo.toml
        # The grep+sed version assumed `version = "X"` with single
        # whitespace; the workspace files actually use aligned columns
        # (`version     = "X"`), making the regex miss and the
        # extracted version blank. awk -F'"' is whitespace-insensitive
        # and pulls the quoted value directly.
        #
        # hsh-backend-awslc is intentionally a non-workspace member but
        # is published alongside the workspace crates — its version
        # must stay in lockstep because `hsh`'s optional dep on it
        # references the same version literal.
        run: |
          tag_ver="${{ steps.extract.outputs.version }}"
          fail=0
          for manifest in crates/hsh/Cargo.toml crates/hsh-cli/Cargo.toml \
                          crates/hsh-kms/Cargo.toml crates/hsh-digest/Cargo.toml \
                          crates/hsh-backend-awslc/Cargo.toml; do
            cargo_ver="$(awk -F'"' '/^[[:space:]]*version[[:space:]]*=/ {print $2; exit}' "$manifest")"
            if [ "$cargo_ver" != "$tag_ver" ]; then
              echo "::error::tag $tag_ver != $manifest $cargo_ver"
              fail=1
            else
              echo "OK: $manifest = $cargo_ver"
            fi
          done
          exit "$fail"

  # ---------------------------------------------------------------------
  # SBOM generation via cargo-about.
  # ---------------------------------------------------------------------
  sbom:
    runs-on: ubuntu-latest
    needs: verify-version
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install cargo-about
        run: cargo install --locked cargo-about
      - name: Generate plain-text NOTICE
        run: |
          mkdir -p artifacts
          cargo about generate --output-file artifacts/NOTICE.md doc/about.md.hbs \
            || echo "no template yet — emitting `cargo about` raw output instead" \
            && cargo about generate --output-file artifacts/NOTICE.md \
                <(echo '{{#each licenses}}- {{name}} ({{spdx_id}}){{/each}}') \
            || true
      - name: Cargo tree manifest
        run: cargo tree --workspace --all-features --no-default-features > artifacts/CARGO-TREE.txt || true
      - name: Upload SBOM artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: artifacts/

  # ---------------------------------------------------------------------
  # SLSA L3 build provenance + sigstore keyless signing.
  #
  # The attest-build-provenance action does SLSA L3 in-toto attestations
  # using the GitHub OIDC token. cosign sign-blob with --yes uses the
  # same OIDC for keyless signing through Fulcio + Rekor.
  # ---------------------------------------------------------------------
  attest:
    runs-on: ubuntu-latest
    needs: sbom
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release artefact
        run: |
          mkdir -p artifacts
          cargo build --release --workspace
          cp target/release/hsh artifacts/hsh-${{ needs.verify-version.outputs.version }}-x86_64-unknown-linux-gnu \
            || echo "no binary — library-only release"
          (cd artifacts && find . -type f -exec sha256sum {} +) > artifacts/SHA256SUMS || true
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless sign every artefact
        # cosign v4 deprecated --output-signature / --output-certificate
        # and now requires --bundle for sign-blob output. The bundle is a
        # single JSON file containing both the signature and the Fulcio
        # certificate; consumers verify with `cosign verify-blob --bundle
        # <file>.cosign-bundle.json <artefact>`. The OIDC identity (this
        # repo's GitHub Actions workflow) is anchored via Fulcio + Rekor
        # transparency log just as before.
        run: |
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --bundle "${f}.cosign-bundle.json" "$f"
          done
      - name: Upload signed artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-artefacts
          path: artifacts/

  # ---------------------------------------------------------------------
  # Publish to crates.io in dependency order:
  #   hsh-kms / hsh-digest / hsh-backend-awslc — no internal deps, can
  #     publish first in any order
  #   hsh — depends on hsh-kms + hsh-digest (behind feature gates) and
  #     hsh-backend-awslc (behind the `fips` feature gate); must publish
  #     AFTER all three
  #   hsh-cli — depends on hsh; must publish LAST
  # ---------------------------------------------------------------------
  publish:
    runs-on: ubuntu-latest
    needs: [verify-version, attest]
    environment: crates-io
    permissions:
      contents: read
      # OIDC token for crates.io trusted publishing.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install FIPS build toolchain
        # hsh-backend-awslc's verify step (cargo publish runs `cargo build`
        # before uploading) needs Go + CMake + clang to compile the
        # aws-lc-fips-sys sub-build. ubuntu-latest preinstalls all three.
        # Print versions so a missing-toolchain regression surfaces here
        # rather than as a confusing aws-lc-fips-sys error.
        run: |
          go version
          cmake --version | head -1
          clang --version | head -1
      # Trusted publishing: swaps this job's OIDC identity for a temporary
      # crates.io token, revoked when the job ends. Each of the five
      # crates published below needs its own trusted publisher on
      # crates.io (repo + release.yml + environment crates-io).
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: "Cargo publish (dep order: kms → digest → backend-awslc → hsh → cli)"
        # `cargo publish` for hsh / hsh-cli fails-fast if the transitive
        # crates haven't appeared on crates.io yet. The `sleep` between
        # publishes lets the registry index propagate before the next
        # dependent crate tries to resolve. hsh-backend-awslc is a
        # non-workspace member, so it's published via --manifest-path
        # rather than -p.
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish -p hsh-kms     --token "$CARGO_REGISTRY_TOKEN"
          sleep 30
          cargo publish -p hsh-digest  --token "$CARGO_REGISTRY_TOKEN"
          sleep 30
          cargo publish --manifest-path crates/hsh-backend-awslc/Cargo.toml \
                        --token "$CARGO_REGISTRY_TOKEN"
          sleep 30
          cargo publish -p hsh         --token "$CARGO_REGISTRY_TOKEN"
          sleep 30
          cargo publish -p hsh-cli     --token "$CARGO_REGISTRY_TOKEN"

  # ---------------------------------------------------------------------
  # Create the GitHub Release page and attach the signed artefacts +
  # SBOM + NOTICE produced by the earlier jobs. Notes come from the
  # matching CHANGELOG.md `[X.Y.Z]` section, extracted at run time.
  # ---------------------------------------------------------------------
  github-release:
    runs-on: ubuntu-latest
    needs: [verify-version, attest, publish]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download signed artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-artefacts
          path: artifacts/
      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom/
        continue-on-error: true
      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          # Pull lines between `## [<VERSION>]` and the next `## [` header.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { in_section = 1; next }
            in_section && /^## \[/   { exit }
            in_section               { print }
          ' CHANGELOG.md > release-notes.md
          echo "Notes (first 30 lines):"
          head -30 release-notes.md
          echo "notes-path=release-notes.md" >> "$GITHUB_OUTPUT"
      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          tag="v${VERSION}"
          # `gh release create` fails if the release already exists;
          # in that case fall through to `edit` (handles workflow re-runs).
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --notes-file release-notes.md \
              --title "$tag" \
              --verify-tag
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes-file release-notes.md \
              --verify-tag
          fi
          # Attach every signed artefact + the SBOM if present.
          if compgen -G "artifacts/*" >/dev/null; then
            gh release upload "$tag" artifacts/* --clobber
          fi
          if compgen -G "sbom/*" >/dev/null; then
            gh release upload "$tag" sbom/* --clobber
          fi
